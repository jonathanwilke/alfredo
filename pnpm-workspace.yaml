packages:
    - config
    - apps/*
    - packages/*
    - tooling/*

allowBuilds:
    "@parcel/watcher": true
    "@prisma/client": false
    "@swc/core": true
    "@tailwindcss/oxide": true
    better-sqlite3: false
    esbuild: true
    sharp: true

# pnpm 12 ignores these keys in .npmrc. shamefullyHoist keeps transitive
# packages visible. Do not set nodeLinker: hoisted: pnpm 12.16.1 applies it
# while provisioning the packageManager engine and then deletes that engine.
shamefullyHoist: true
strictPeerDependencies: false

# Today's releases are the versions we just pinned. The default one-day wait would reject them.
minimumReleaseAge: 1
